<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地 LLM 问答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1120; --surface:#131F33; --line:#22334E; --input:#0D1B2C;
  --text:#E8EEF7; --muted:#94A6C0; --faint:#5E7291;
  --accent:#2DD4BF; --user:#1E3A5F; --ok:#34D399;
  --mono:'JetBrains Mono',monospace; --body:'IBM Plex Sans',system-ui,sans-serif; --disp:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--body);
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px; background-position:-1px -1px;
}

/* header */
header{
  padding:14px 22px; background:rgba(13,27,44,.85); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:18px; backdrop-filter:blur(6px); z-index:5;
}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--disp); font-weight:700; font-size:16px}
.brand .bolt{color:var(--accent)}
.brand small{color:var(--muted); font-weight:400; font-size:12px; font-family:var(--mono)}
.mode-pill{display:flex; background:var(--input); border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-left:auto}
.mode-pill button{
  background:none; border:none; color:var(--muted); font-family:var(--mono); font-size:12.5px;
  padding:7px 14px; cursor:pointer; transition:.15s;
}
.mode-pill button.on{background:var(--accent-soft,#163A3A); color:var(--accent)}
.model-tag{font-family:var(--mono); font-size:12px; color:var(--muted); background:var(--input);
  border:1px solid var(--line); padding:6px 12px; border-radius:6px}

/* chat area */
.chat{flex:1; overflow-y:auto; padding:26px 22px; max-width:820px; width:100%; margin:0 auto}
.msg{display:flex; margin-bottom:20px; gap:12px; animation:in .2s ease}
@keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.avatar{width:34px; height:34px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:var(--disp); font-weight:700; font-size:15px}
.msg.user .avatar{background:var(--user); color:#BFE0FF}
.msg.bot .avatar{background:var(--accent-soft,#163A3A); color:var(--accent)}
.bubble{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:13px 16px; font-size:15px; line-height:1.65; white-space:pre-wrap; word-break:break-word; max-width:100%}
.msg.user .bubble{background:#1A2A44}
.msg.bot .bubble{max-width:100%}
.msg.bot .bubble.err{border-color:#E05B5B}
.msg.bot .bubble.err::before{content:"⚠ "; color:#E05B5B}
.typing{font-family:var(--mono); color:var(--muted); font-size:13px; display:flex; align-items:center; gap:8px}
.typing .d{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
.typing .d:nth-child(2){animation-delay:.2s}.typing .d:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* empty state */
.empty{max-width:820px; margin:auto; text-align:center; padding:40px 22px; color:var(--muted)}
.empty h2{font-family:var(--disp); color:var(--text); margin-bottom:10px}
.empty .hint{font-size:14px; line-height:1.9}
.empty .sugg{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:22px}
.empty .sugg button{background:var(--surface); border:1px solid var(--line); color:var(--text);
  font-family:var(--body); font-size:13.5px; padding:9px 16px; border-radius:8px; cursor:pointer; transition:.15s}
.empty .sugg button:hover{border-color:var(--accent); color:var(--accent)}

/* input */
.inputbar{background:rgba(13,27,44,.9); border-top:1px solid var(--line); padding:16px 22px; backdrop-filter:blur(6px)}
.inputinner{max-width:820px; width:100%; margin:0 auto; display:flex; gap:10px}
.inputinner textarea{
  flex:1; background:var(--input); border:1px solid var(--line); border-radius:10px; color:var(--text);
  font-family:var(--body); font-size:15px; line-height:1.5; padding:13px 16px; resize:none; height:52px;
}
.inputinner textarea:focus{outline:none; border-color:var(--accent)}
.send{
  background:var(--accent); border:none; color:#03211B; font-family:var(--disp); font-weight:600;
  font-size:15px; padding:0 22px; border-radius:10px; cursor:pointer; transition:.15s; height:52px;
}
.send:hover{filter:brightness(1.1)}
.send:disabled{opacity:.5; cursor:not-allowed}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="bolt">⚡</span>本地 LLM 问答 <small>· Ollama</small></div>
  <div class="model-tag" id="modelTag">qwen2.5-coder:7b</div>
  <!-- 徽章由 loadModels() 从 /api/models 动态覆盖；此值为无模型时的占位，与后端 OLLAMA_MODEL 默认一致 -->
  <div class="mode-pill">
    <button id="mPlain" class="on">直接对话</button>
    <button id="mRag">查本地资料</button>
  </div>
</header>

<div class="chat" id="chat">
  <div class="empty" id="empty">
    <h2>和本地模型对话</h2>
    <div class="hint">模型在本机运行，回答只用本地算力。<br>「直接对话」让模型自由发挥；「查本地资料」会先检索本地知识文件再回答。</div>
    <div class="sugg">
      <button data-q="请用一句话介绍你自己">介绍你自己</button>
      <button data-q="Ollama 支持哪些模型？">Ollama 支持哪些模型</button>
      <button data-q="Ollama 默认监听在哪个端口？">监听端口</button>
      <button data-q="Ollama 如何实现 GPU 加速？">GPU 加速</button>
    </div>
  </div>
</div>

<div class="inputbar">
  <div class="inputinner">
    <textarea id="inp" placeholder="输入问题，回车发送…" rows="1"></textarea>
    <button class="send" id="send">发送</button>
  </div>
</div>

<script>
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), send=document.getElementById('send');
let mode='plain', messages=[];

async function loadModels(){
  try{
    const r=await fetch('/api/models'); const m=await r.json();
    if(Array.isArray(m)&&m.length) document.getElementById('modelTag').textContent=m[0];
  }catch(e){}
}
loadModels();

function addRole(role, text){
  const empty=document.getElementById('empty'); if(empty) empty.remove();
  const div=document.createElement('div'); div.className='msg '+role;
  const av=document.createElement('div'); av.className='avatar'; av.textContent = role==='user'?'我':'AI';
  const b=document.createElement('div'); b.className='bubble'; b.textContent=text;
  div.appendChild(av); div.appendChild(b); chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
  return b;
}
function addTyping(){
  const empty=document.getElementById('empty'); if(empty) empty.remove();
  const div=document.createElement('div'); div.className='msg bot';
  const av=document.createElement('div'); av.className='avatar'; av.textContent='AI';
  const b=document.createElement('div'); b.className='bubble';
  b.innerHTML='<span class="typing"><span class="d"></span><span class="d"></span><span class="d"></span></span>';
  div.appendChild(av); div.appendChild(b); chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
  return b;
}

async function go(text){
  if(!text.trim()) return;
  addRole('user', text);
  messages.push({role:'user', content:text});
  const typing=addTyping();
  send.disabled=true; inp.disabled=true;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mode, messages})});
    const d=await r.json();
    typing.remove();
    if(d.error){ addRole('bot', d.error).classList.add('err'); }
    else{
      addRole('bot', d.answer);
      messages.push({role:'assistant', content:d.answer});
    }
  }catch(e){
    typing.remove(); addRole('bot', '请求失败：'+e.message).classList.add('err');
  }
  send.disabled=false; inp.disabled=false; inp.focus();
}

send.onclick=()=>{go(inp.value); inp.value='';};
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); go(inp.value); inp.value='';}
});
document.querySelectorAll('.sugg button').forEach(b=>b.onclick=()=>go(b.dataset.q));
// 模式切换
const mP=document.getElementById('mPlain'), mR=document.getElementById('mRag');
mP.onclick=()=>{mode='plain'; mP.classList.add('on'); mR.classList.remove('on');};
mR.onclick=()=>{mode='rag';  mR.classList.add('on'); mP.classList.remove('on');};

// 首屏自动发一条打招呼
go('请用一句话介绍你自己');
</script>
</body>
</html>
